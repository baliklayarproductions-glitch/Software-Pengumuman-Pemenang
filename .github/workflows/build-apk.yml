name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Ubah HTML menjadi APK
        run: |
          npm install -g cordova
          cordova create keygen_app com.studio.keygen "KeyGen PP"
          rm -rf keygen_app/www/*
          
          # Memeriksa file keygen.html
          if [ ! -f "keygen.html" ]; then
            echo "ERROR: File keygen.html tidak ditemukan! Buat dulu filenya."
            exit 1
          fi
          
          # Memasukkan HTML ke dalam aplikasi Android
          cp keygen.html keygen_app/www/index.html
          cd keygen_app
          cordova platform add android
          cordova build android

      - name: Upload File APK
        uses: actions/upload-artifact@v4
        with:
          name: KeyGenerator-APK
          path: keygen_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
