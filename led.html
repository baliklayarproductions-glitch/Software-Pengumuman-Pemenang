<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --pos-y: 0px; --box-scale: 1; --box-pad: 48px;
      --font-main: 60px; --font-kat: 24px;
      --font-nama: 150%; --font-no: 120%; --font-title: 100%;
      --col-j1: #eab308; --col-j2: #64748b; --col-j3: #d97706; 
    }
    .aspect-16-9-wrapper { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.77vh; margin: auto; overflow: hidden; background-color: #000; }
    .anim-container { opacity: 0; transform: translateY(50px) scale(var(--box-scale)); transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1); position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .show { opacity: 1; transform: translateY(var(--pos-y)) scale(var(--box-scale)); z-index: 10; }
    #main-title { font-size: var(--font-main); line-height: 1.1; }
    .title-category { font-size: var(--font-kat); line-height: 1.2; }
    .dynamic-title { font-size: var(--font-title); font-family: 'Segoe UI', sans-serif; font-weight: 900;}
    .dynamic-no { font-size: var(--font-no); font-family: 'Courier New', monospace; font-weight: 700; line-height: 1.2;}
    .dynamic-name { font-size: var(--font-nama); word-break: break-word; line-height: 1.1; font-family: 'Segoe UI', sans-serif;}
    .bg-media { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -10; }
    .box-custom { border: 3px solid rgba(255,255,255,0.4); box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(8px); border-radius: 1.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--box-pad) 2rem; }
  </style>
</head>
<body class="m-0 bg-black w-screen h-screen flex items-center justify-center overflow-hidden">
  
  <div class="aspect-16-9-wrapper">
    <video id="bg-video" autoplay loop muted class="bg-media hidden"></video>
    <img id="bg-image" class="bg-media hidden" />
    <div id="bg-fallback" class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-slate-900 to-black -z-20"></div>

    <div id="box-single" class="anim-container px-10 hidden">
      <!-- SUSUNAN YANG BENAR: JUDUL DI ATAS, KATEGORI DI BAWAHNYA -->
      <h1 id="single-title-main" class="font-black text-white mb-4 tracking-widest uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]" style="font-size: var(--font-main);">PEMENANG LOMBA</h1>
      <h3 id="single-category" class="title-category font-bold text-white mb-8 uppercase tracking-[0.2em] bg-black/60 px-8 py-2 rounded-full border border-white/20 hidden">KATEGORI</h3>
      
      <div id="single-card" class="box-custom w-full max-w-4xl text-center" style="background-color: var(--col-j1);">
        <h2 id="single-title" class="dynamic-title text-black/80 mb-3 tracking-widest uppercase">JUARA</h2>
        <p id="single-no" class="dynamic-no text-white/90 drop-shadow-md mb-2">-</p>
        <p id="single-name" class="dynamic-name text-white font-black drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">-</p>
      </div>
    </div>

    <div id="box-all" class="anim-container w-full px-8 hidden">
      <!-- SUSUNAN YANG BENAR: JUDUL DI ATAS, KATEGORI DI BAWAHNYA -->
      <h1 id="main-title" class="font-black text-white mb-4 tracking-widest uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">PEMENANG LOMBA</h1>
      <h3 id="all-category" class="title-category font-bold text-white mb-8 uppercase tracking-[0.2em] bg-black/60 px-8 py-2 rounded-full border border-white/20 hidden">KATEGORI</h3>
      
      <div class="grid grid-cols-3 gap-6 w-full max-w-7xl items-end">
        <div class="box-custom text-center transform translate-y-8" style="background-color: var(--col-j3);">
          <h2 class="dynamic-title text-black/70 mb-2">JUARA 3</h2>
          <p id="txt-all-j3-no" class="dynamic-no text-white/90 drop-shadow-md mb-1">-</p>
          <p id="txt-all-j3-nama" class="dynamic-name text-white font-bold drop-shadow-md">-</p>
        </div>
        <div class="box-custom text-center transform -translate-y-6 z-10" style="background-color: var(--col-j1); border-width: 4px; box-shadow: 0 0 40px var(--col-j1); padding-top: calc(var(--box-pad) + 16px); padding-bottom: calc(var(--box-pad) + 16px);">
          <h2 class="dynamic-title text-black/80 mb-3">JUARA 1</h2>
          <p id="txt-all-j1-no" class="dynamic-no text-white/90 drop-shadow-md mb-2">-</p>
          <p id="txt-all-j1-nama" class="dynamic-name text-white font-black drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">-</p>
        </div>
        <div class="box-custom text-center transform translate-y-8" style="background-color: var(--col-j2);">
          <h2 class="dynamic-title text-black/70 mb-2">JUARA 2</h2>
          <p id="txt-all-j2-no" class="dynamic-no text-white/90 drop-shadow-md mb-1">-</p>
          <p id="txt-all-j2-nama" class="dynamic-name text-white font-bold drop-shadow-md">-</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const root = document.documentElement;
    const boxAll = document.getElementById('box-all');
    const boxSingle = document.getElementById('box-single');

    function getSafeFileURI(filePath) {
      if (!filePath) return '';
      let safePath = filePath.replace(/\\/g, '/');
      if (!safePath.startsWith('/')) safePath = '/' + safePath;
      return 'file://' + encodeURI(safePath).replace(/#/g, '%23').replace(/\?/g, '%3F');
    }

    ipcRenderer.on('update-led', (event, data) => {
      if(data.action === 'update-visuals') {
        root.style.setProperty('--pos-y', data.boxY); root.style.setProperty('--box-scale', data.boxScale);
        root.style.setProperty('--box-pad', data.boxPad); root.style.setProperty('--font-main', data.sizeMain);
        root.style.setProperty('--font-kat', data.sizeKat); root.style.setProperty('--font-nama', data.fontSize);
        root.style.setProperty('--font-no', data.noSize); root.style.setProperty('--font-title', data.titleSize);
        root.style.setProperty('--col-j1', data.colJ1); root.style.setProperty('--col-j2', data.colJ2);
        root.style.setProperty('--col-j3', data.colJ3);

        if(data.bgPath) {
          const videoEl = document.getElementById('bg-video');
          const imageEl = document.getElementById('bg-image');
          document.getElementById('bg-fallback').classList.add('hidden');
          
          const safeURI = getSafeFileURI(data.bgPath); // PENGGUNAAN PATH MURNI ANTI GAGAL

          if (data.bgType && data.bgType.startsWith('video/')) {
            imageEl.classList.add('hidden');
            videoEl.src = safeURI;
            videoEl.classList.remove('hidden'); 
            videoEl.play().catch(e => console.log("Play error", e));
          } else {
            videoEl.classList.add('hidden');
            videoEl.pause();
            imageEl.src = safeURI;
            imageEl.classList.remove('hidden');
          }
        } else {
          document.getElementById('bg-video').classList.add('hidden');
          document.getElementById('bg-image').classList.add('hidden');
          document.getElementById('bg-fallback').classList.remove('hidden');
        }
        return; 
      }

      boxAll.classList.remove('show'); boxSingle.classList.remove('show');
      if(data.action === 'clear') {
        setTimeout(() => { boxAll.classList.add('hidden'); boxSingle.classList.add('hidden'); }, 600);
        return;
      }

      setTimeout(() => {
        boxAll.classList.remove('hidden'); boxSingle.classList.remove('hidden');
        const catAll = document.getElementById('all-category'); const catSingle = document.getElementById('single-category');
        if (data.kategori && data.kategori.trim() !== '') {
            catAll.innerText = data.kategori; catSingle.innerText = data.kategori;
            catAll.classList.remove('hidden'); catSingle.classList.remove('hidden');
        } else {
            catAll.classList.add('hidden'); catSingle.classList.add('hidden');
        }

        if(data.action === 'show-all') {
          boxSingle.classList.add('hidden');
          document.getElementById('txt-all-j1-no').innerText = data.j1no; document.getElementById('txt-all-j1-nama').innerText = data.j1nama;
          document.getElementById('txt-all-j2-no').innerText = data.j2no; document.getElementById('txt-all-j2-nama').innerText = data.j2nama;
          document.getElementById('txt-all-j3-no').innerText = data.j3no; document.getElementById('txt-all-j3-nama').innerText = data.j3nama;
          void boxAll.offsetWidth; boxAll.classList.add('show');
        } else {
          boxAll.classList.add('hidden');
          const singleCard = document.getElementById('single-card');
          if(data.action === 'show-j3') {
            document.getElementById('single-title').innerText = "JUARA 3"; document.getElementById('single-no').innerText = data.j3no; document.getElementById('single-name').innerText = data.j3nama; singleCard.style.backgroundColor = "var(--col-j3)";
          } else if(data.action === 'show-j2') {
            document.getElementById('single-title').innerText = "JUARA 2"; document.getElementById('single-no').innerText = data.j2no; document.getElementById('single-name').innerText = data.j2nama; singleCard.style.backgroundColor = "var(--col-j2)";
          } else if(data.action === 'show-j1') {
            document.getElementById('single-title').innerText = "JUARA 1"; document.getElementById('single-no').innerText = data.j1no; document.getElementById('single-name').innerText = data.j1nama; singleCard.style.backgroundColor = "var(--col-j1)";
          }
          void boxSingle.offsetWidth; boxSingle.classList.add('show');
        }
      }, 400); 
    });
  </script>
</body>
</html>
