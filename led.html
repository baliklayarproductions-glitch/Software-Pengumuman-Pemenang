<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .anim-container {
      opacity: 0;
      transform: translateY(50px) scale(var(--custom-scale, 1));
      transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      position: absolute;
      width: 100%;
    }
    .show {
      opacity: 1;
      transform: translateY(var(--custom-y, 0px)) scale(var(--custom-scale, 1));
      z-index: 10;
    }
    
    :root {
      --custom-y: 0px;
      --custom-scale: 1;
      --custom-font-family: 'Segoe UI', Tahoma, sans-serif;
      --custom-font-size: 150%;
    }

    .dynamic-text {
      font-family: var(--custom-font-family);
      font-size: var(--custom-font-size);
      word-break: break-word; 
      line-height: 1.1;
    }
    .bg-media { position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -10; }
  </style>
</head>
<body class="overflow-hidden m-0 w-screen h-screen flex flex-col items-center justify-center bg-black">
  
  <video id="bg-video" autoplay loop muted class="bg-media hidden"></video>
  <img id="bg-image" class="bg-media hidden" />
  <div id="bg-fallback" class="fixed inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900 via-slate-900 to-black -z-20"></div>

  <div id="main-wrapper" class="relative w-full h-full flex items-center justify-center">

    <!-- BOX INDIVIDUAL -->
    <div id="box-single" class="anim-container flex flex-col items-center justify-center px-10">
      
      <!-- KATEGORI (MUNCUL DI ATAS) -->
      <h3 id="single-category" class="text-3xl font-bold text-white mb-6 uppercase tracking-[0.3em] bg-black/50 px-8 py-2 rounded-full border border-slate-500/50 backdrop-blur-sm hidden">KATEGORI 10K</h3>

      <div id="single-card" class="w-full max-w-4xl bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-3xl border-4 border-white/20 p-12 text-center shadow-2xl">
        <h2 id="single-title" class="text-4xl text-black font-black mb-4 tracking-widest uppercase">JUARA</h2>
        <p id="single-name" class="dynamic-text text-white font-black drop-shadow-xl">-</p>
      </div>
    </div>

    <!-- BOX SEMUA JUARA (PODIUM) -->
    <div id="box-all" class="anim-container flex flex-col items-center justify-center w-full max-w-7xl px-8">
      
      <!-- KATEGORI (MUNCUL DI ATAS PODIUM) -->
      <h3 id="all-category" class="text-2xl font-bold text-white mb-4 uppercase tracking-[0.3em] bg-black/50 px-8 py-2 rounded-full border border-slate-500/50 backdrop-blur-sm hidden">KATEGORI 10K</h3>

      <h1 class="text-5xl font-black text-yellow-400 mb-8 tracking-widest uppercase drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)]">PEMENANG LOMBA</h1>
      
      <div class="grid grid-cols-3 gap-6 w-full items-end">
        <!-- Juara 3 -->
        <div class="bg-black/70 backdrop-blur-md rounded-2xl border-t-4 border-amber-600 p-8 text-center shadow-lg transform translate-y-8">
          <h2 class="text-2xl text-amber-500 mb-4 font-bold">JUARA 3</h2>
          <p id="txt-all-j3" class="dynamic-text text-white font-bold">-</p>
        </div>
        <!-- Juara 1 -->
        <div class="bg-gradient-to-b from-yellow-600/90 to-black/90 backdrop-blur-md rounded-2xl border-2 border-yellow-400 p-10 text-center shadow-[0_0_50px_rgba(250,204,21,0.3)] transform -translate-y-6 z-10">
          <h2 class="text-4xl text-yellow-400 mb-4 font-black">JUARA 1</h2>
          <p id="txt-all-j1" class="dynamic-text text-white font-black text-shadow-lg scale-110">-</p>
        </div>
        <!-- Juara 2 -->
        <div class="bg-black/70 backdrop-blur-md rounded-2xl border-t-4 border-slate-400 p-8 text-center shadow-lg transform translate-y-8">
          <h2 class="text-2xl text-slate-300 mb-4 font-bold">JUARA 2</h2>
          <p id="txt-all-j2" class="dynamic-text text-white font-bold">-</p>
        </div>
      </div>
    </div>

  </div>

  <script>
    const { ipcRenderer } = require('electron');
    const root = document.documentElement;
    const boxAll = document.getElementById('box-all');
    const boxSingle = document.getElementById('box-single');

    ipcRenderer.on('update-led', (event, data) => {
      if(data.action === 'update-visuals') {
        root.style.setProperty('--custom-y', data.boxY);
        root.style.setProperty('--custom-scale', data.boxScale);
        root.style.setProperty('--custom-font-size', data.fontSize);
        root.style.setProperty('--custom-font-family', data.fontFamily);

        if(data.bgPath) {
          const videoEl = document.getElementById('bg-video');
          const imageEl = document.getElementById('bg-image');
          document.getElementById('bg-fallback').classList.add('hidden');

          if (data.bgType && data.bgType.startsWith('video/')) {
            imageEl.classList.add('hidden');
            videoEl.src = 'file://' + data.bgPath;
            videoEl.classList.remove('hidden');
            videoEl.play();
          } else {
            videoEl.classList.add('hidden');
            imageEl.src = 'file://' + data.bgPath;
            imageEl.classList.remove('hidden');
          }
        }
        return; 
      }

      boxAll.classList.remove('show');
      boxSingle.classList.remove('show');
      
      if(data.action === 'clear') return;

      setTimeout(() => {
        // MENGATUR KATEGORI
        const catAll = document.getElementById('all-category');
        const catSingle = document.getElementById('single-category');
        
        if (data.kategori && data.kategori.trim() !== '') {
            catAll.innerText = data.kategori;
            catSingle.innerText = data.kategori;
            catAll.classList.remove('hidden');
            catSingle.classList.remove('hidden');
        } else {
            catAll.classList.add('hidden');
            catSingle.classList.add('hidden');
        }

        if(data.action === 'show-all') {
          document.getElementById('txt-all-j3').innerText = data.j3;
          document.getElementById('txt-all-j2').innerText = data.j2;
          document.getElementById('txt-all-j1').innerText = data.j1;
          boxAll.classList.add('show');
        } else {
          const singleCard = document.getElementById('single-card');
          if(data.action === 'show-j3') {
            document.getElementById('single-title').innerText = "JUARA 3";
            document.getElementById('single-name').innerText = data.j3;
            singleCard.className = "w-full max-w-4xl bg-gradient-to-tr from-amber-700 to-amber-900 rounded-3xl border-2 border-amber-500 p-12 text-center shadow-2xl";
          } else if(data.action === 'show-j2') {
            document.getElementById('single-title').innerText = "JUARA 2";
            document.getElementById('single-name').innerText = data.j2;
            singleCard.className = "w-full max-w-4xl bg-gradient-to-tr from-slate-400 to-slate-600 rounded-3xl border-2 border-slate-300 p-12 text-center shadow-2xl";
          } else if(data.action === 'show-j1') {
            document.getElementById('single-title').innerText = "JUARA 1";
            document.getElementById('single-name').innerText = data.j1;
            singleCard.className = "w-full max-w-4xl bg-gradient-to-tr from-yellow-500 to-yellow-600 rounded-3xl border-4 border-yellow-300 p-14 text-center shadow-[0_0_50px_rgba(250,204,21,0.5)]";
          }
          boxSingle.classList.add('show');
        }
      }, 400); 
    });
  </script>
</body>
</html>
