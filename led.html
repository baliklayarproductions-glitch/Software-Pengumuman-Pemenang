<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .anim-box { opacity: 0; transform: scale(0.9); transition: all 0.5s ease-out; position: absolute; }
    .show { opacity: 1; transform: scale(1); z-index: 10;}
  </style>
</head>
<body class="overflow-hidden m-0 w-screen h-screen flex items-center justify-center bg-black">
  
  <!-- Background Image/Video -->
  <div class="fixed inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-blue-900 via-slate-900 to-black -z-10"></div>

  <div class="w-full h-full flex items-center justify-center relative p-10">
    
    <!-- Box Tampil Semua -->
    <div id="box-all" class="anim-box w-full max-w-6xl bg-black/60 backdrop-blur-xl rounded-3xl border-2 border-blue-500 p-12 text-center shadow-[0_0_80px_rgba(37,99,235,0.3)]">
      <h1 class="text-6xl font-black text-yellow-400 mb-12 tracking-wider">PEMENANG LOMBA</h1>
      <div class="flex w-full justify-between items-end px-10">
        <div class="w-1/3"><h2 class="text-3xl text-amber-500 mb-2 font-bold">Juara 3</h2><p id="txt-all-j3" class="text-4xl font-bold text-white">-</p></div>
        <div class="w-1/3 mb-10"><h2 class="text-5xl text-yellow-400 mb-4 font-black drop-shadow-lg">JUARA 1</h2><p id="txt-all-j1" class="text-6xl font-black text-white drop-shadow-xl">-</p></div>
        <div class="w-1/3"><h2 class="text-3xl text-slate-300 mb-2 font-bold">Juara 2</h2><p id="txt-all-j2" class="text-4xl font-bold text-white">-</p></div>
      </div>
    </div>

    <!-- Box Tampil Individual (J1, J2, J3) -->
    <div id="box-single" class="anim-box w-full max-w-4xl bg-gradient-to-tr from-yellow-600 to-amber-400 rounded-3xl border-4 border-white/20 p-16 text-center shadow-2xl">
      <h2 id="single-title" class="text-5xl text-black font-black mb-6 tracking-widest">JUARA</h2>
      <p id="single-name" class="text-7xl text-white font-black drop-shadow-[0_4px_4px_rgba(0,0,0,0.5)]">-</p>
    </div>

  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('update-led', (event, data) => {
      const boxAll = document.getElementById('box-all');
      const boxSingle = document.getElementById('box-single');
      
      // Reset animasi (sembunyikan semua)
      boxAll.classList.remove('show');
      boxSingle.classList.remove('show');
      
      if(data.action === 'clear') return;

      setTimeout(() => {
        if(data.action === 'show-all') {
          document.getElementById('txt-all-j3').innerText = data.j3;
          document.getElementById('txt-all-j2').innerText = data.j2;
          document.getElementById('txt-all-j1').innerText = data.j1;
          boxAll.classList.add('show');
        } else {
          // Tampil satu per satu
          if(data.action === 'show-j3') {
            document.getElementById('single-title').innerText = "JUARA 3";
            document.getElementById('single-name').innerText = data.j3;
            boxSingle.className = "anim-box w-full max-w-4xl bg-gradient-to-tr from-amber-700 to-amber-500 rounded-3xl border-4 border-white/20 p-16 text-center shadow-2xl";
          } else if(data.action === 'show-j2') {
            document.getElementById('single-title').innerText = "JUARA 2";
            document.getElementById('single-name').innerText = data.j2;
            boxSingle.className = "anim-box w-full max-w-4xl bg-gradient-to-tr from-slate-400 to-slate-300 rounded-3xl border-4 border-white/20 p-16 text-center shadow-2xl";
          } else if(data.action === 'show-j1') {
            document.getElementById('single-title').innerText = "JUARA 1";
            document.getElementById('single-name').innerText = data.j1;
            boxSingle.className = "anim-box w-full max-w-4xl bg-gradient-to-tr from-yellow-500 to-yellow-300 rounded-3xl border-4 border-white/20 p-16 text-center shadow-2xl";
          }
          boxSingle.classList.add('show');
        }
      }, 400); // jeda sedikit agar efek fade out terlihat sebelum data baru masuk
    });
  </script>
</body>
</html>
