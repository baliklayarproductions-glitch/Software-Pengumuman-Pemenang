<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Transisi Halus */
    .winner-card { opacity: 0; transform: translateY(50px); transition: all 0.8s ease-out; }
    .show { opacity: 1; transform: translateY(0); }
    /* Video Background */
    #bg-video { position: fixed; top: 0; left: 0; min-width: 100%; min-height: 100%; z-index: -1; object-fit: cover; }
  </style>
</head>
<body class="overflow-hidden m-0 w-screen h-screen flex items-center justify-center">
  
  <!-- Video Grafis Anti Lagging (Taruh file bg.mp4 di folder) -->
  <!-- <video id="bg-video" autoplay loop muted><source src="bg.mp4" type="video/mp4"></video> -->
  <div class="fixed inset-0 bg-gradient-to-br from-blue-900 to-black -z-10"></div> <!-- Fallback bg -->

  <div id="container" class="w-full h-full flex flex-col items-center justify-center gap-10 p-10 relative">
    
    <!-- Kotak Besar (Show All) -->
    <div id="box-all" class="winner-card absolute w-11/12 h-5/6 bg-black/60 backdrop-blur-md rounded-3xl border-4 border-blue-500 hidden flex-col items-center justify-center gap-8 shadow-[0_0_50px_rgba(59,130,246,0.5)]">
      <h1 class="text-6xl font-black text-yellow-400 mb-10">PEMENANG LOMBA LARI</h1>
      <div class="flex w-full justify-around text-center">
        <div><h2 class="text-3xl text-slate-300">Juara 3</h2><p id="txt-all-j3" class="text-5xl font-bold text-white mt-2">-</p></div>
        <div><h2 class="text-4xl text-yellow-500">Juara 1</h2><p id="txt-all-j1" class="text-6xl font-black text-white mt-2">-</p></div>
        <div><h2 class="text-3xl text-slate-300">Juara 2</h2><p id="txt-all-j2" class="text-5xl font-bold text-white mt-2">-</p></div>
      </div>
    </div>

    <!-- Kotak Individual (Tampil berurutan) -->
    <div id="box-j1" class="winner-card absolute bg-gradient-to-t from-yellow-600 to-yellow-400 px-20 py-10 rounded-2xl shadow-2xl text-center hidden">
      <h2 class="text-4xl text-black font-bold mb-2">JUARA 1</h2>
      <p id="txt-j1" class="text-6xl text-white font-black drop-shadow-lg">-</p>
    </div>
    <!-- (Buat box serupa untuk J2 dan J3) -->
    
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    ipcRenderer.on('update-led', (event, data) => {
      // Sembunyikan semua dulu
      document.querySelectorAll('.winner-card').forEach(el => { el.classList.remove('show'); });
      
      setTimeout(() => {
        if(data.action === 'show-all') {
          document.getElementById('box-all').classList.remove('hidden');
          document.getElementById('txt-all-j1').innerText = data.j1;
          document.getElementById('txt-all-j2').innerText = data.j2;
          document.getElementById('txt-all-j3').innerText = data.j3;
          setTimeout(() => document.getElementById('box-all').classList.add('show'), 100);
        } else if (data.action === 'show-j1') {
          // Logika animasi masuk untuk juara 1
          document.getElementById('box-j1').classList.remove('hidden');
          document.getElementById('txt-j1').innerText = data.j1;
          setTimeout(() => document.getElementById('box-j1').classList.add('show'), 100);
        }
        // ... (Lanjutkan logika animasi hide/show untuk J2 dan J3)
      }, 500);
    });
  </script>
</body>
</html>
