<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Generator - Software PP</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-blue-600 rounded-xl mx-auto flex items-center justify-center shadow-lg font-bold text-3xl border-2 border-blue-400 mb-4">
                <span class="text-white">P</span><span class="text-blue-200 -ml-1">P</span>
            </div>
            <h1 class="text-2xl font-bold">Key Generator</h1>
            <p class="text-slate-400 text-sm mt-1">Aktivasi Software Pengumuman Pemenang</p>
        </div>

        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Masukkan Hardware ID Klien:</label>
                <input type="text" id="hwid" placeholder="Contoh: a1b2c3d4-e5f6..." 
                    class="w-full bg-slate-700 text-white px-4 py-3 rounded-lg border border-slate-600 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 font-mono">
            </div>

            <button onclick="generateKey()" 
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-lg shadow-blue-500/30">
                Generate License Key
            </button>

            <div id="result-container" class="hidden mt-6 space-y-3">
                <label class="block text-sm font-medium text-emerald-400">License Key Berhasil Dibuat:</label>
                <div class="relative">
                    <input type="text" id="license-key" readonly 
                        class="w-full bg-slate-900 text-emerald-400 px-4 py-3 rounded-lg border border-emerald-500/30 font-mono text-center font-bold">
                    <button onclick="copyKey()" class="absolute right-2 top-2 bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-sm text-slate-300 transition">
                        Copy
                    </button>
                </div>
                <p class="text-red-400 text-xs text-center font-bold mt-4 border border-red-500/30 bg-red-500/10 p-2 rounded">
                    ⚠️ Harap simpan key dengan baik-baik. Key hanya berlaku untuk 1 perangkat.
                </p>
            </div>
        </div>
    </div>

    <script>
        function generateKey() {
            const hwid = document.getElementById('hwid').value.trim();
            if (!hwid) {
                alert('Hardware ID tidak boleh kosong!');
                return;
            }

            // Algoritma Generator (Harus sama persis dengan fungsi verifikasi di main.js Electron)
            // HWID -> Base64 -> Reverse string
            try {
                // Encode ke base64 (Btoa digunakan di browser)
                const base64Encoded = btoa(hwid);
                // Balikkan urutan karakternya
                const generatedKey = base64Encoded.split('').reverse().join('');
                
                document.getElementById('license-key').value = generatedKey;
                document.getElementById('result-container').classList.remove('hidden');
            } catch (e) {
                alert('Karakter Hardware ID tidak valid.');
            }
        }

        function copyKey() {
            const keyInput = document.getElementById('license-key');
            keyInput.select();
            keyInput.setSelectionRange(0, 99999); /* Untuk mobile */
            navigator.clipboard.writeText(keyInput.value).then(() => {
                alert('License Key berhasil disalin!');
            });
        }
    </script>
</body>
</html>
