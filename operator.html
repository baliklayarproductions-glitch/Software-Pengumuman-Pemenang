<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Operator - Software Pengumuman Pemenang</title>
</head>
<body class="bg-slate-900 text-white h-screen p-4 font-sans flex flex-col overflow-hidden relative">
  
  <!-- LOCK SCREEN SYSTEM -->
  <div id="lock-screen" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl max-w-md w-full text-center border border-slate-700">
      <h2 class="text-2xl font-bold text-blue-400 mb-4">Aktivasi Software</h2>
      <p class="text-slate-400 text-sm mb-2">Kirim Hardware ID ini ke Admin untuk mendapatkan License Key.</p>
      <input type="text" id="hwid-display" readonly class="w-full bg-slate-950 text-white p-3 rounded mb-4 text-center font-mono border border-slate-600">
      <input type="text" id="license-input" placeholder="Masukkan License Key" class="w-full bg-slate-700 text-white p-3 rounded mb-4 border border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500 font-mono">
      <button onclick="activateApp()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded font-bold transition">Aktivasi Sekarang</button>
    </div>
  </div>

  <!-- HEADER -->
  <header class="flex justify-between items-center mb-4 pb-3 border-b border-slate-700">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-blue-600 rounded flex items-center justify-center font-bold text-xl border border-blue-400"><span class="text-white">P</span><span class="text-blue-200">P</span></div>
      <h1 class="text-xl font-bold">Pengumuman Pemenang</h1>
    </div>
    <div class="flex gap-2">
      <button onclick="openLedWindow()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-bold shadow-lg">🖥️ BUKA LAYAR 2 (LED)</button>
    </div>
  </header>

  <div class="flex gap-4 flex-1 h-full">
    <!-- KONTROL (KIRI) -->
    <div class="w-1/3 bg-slate-800 p-4 rounded-xl shadow-xl flex flex-col gap-4 overflow-y-auto">
      <h2 class="font-bold text-blue-400 border-b border-slate-700 pb-2">Input Data Pemenang</h2>
      
      <div class="space-y-3">
        <div><label class="text-xs text-amber-500 font-bold">JUARA 3</label><input type="text" id="j3" oninput="updatePreview()" placeholder="Contoh: 012 - Budi" class="w-full bg-slate-700 p-2 rounded border border-slate-600 outline-none"></div>
        <div><label class="text-xs text-slate-300 font-bold">JUARA 2</label><input type="text" id="j2" oninput="updatePreview()" placeholder="Contoh: 045 - Agus" class="w-full bg-slate-700 p-2 rounded border border-slate-600 outline-none"></div>
        <div><label class="text-xs text-yellow-400 font-bold">JUARA 1</label><input type="text" id="j1" oninput="updatePreview()" placeholder="Contoh: 088 - Joko" class="w-full bg-slate-700 p-2 rounded border border-slate-600 outline-none"></div>
      </div>

      <div class="grid grid-cols-2 gap-2 mt-2">
        <button onclick="sendToLive('show-j3')" class="bg-amber-600 hover:bg-amber-500 p-3 rounded font-bold">Kirim J3 ➔</button>
        <button onclick="sendToLive('show-j2')" class="bg-slate-300 hover:bg-white text-slate-900 p-3 rounded font-bold">Kirim J2 ➔</button>
        <button onclick="sendToLive('show-j1')" class="bg-yellow-500 hover:bg-yellow-400 text-black p-3 rounded font-bold col-span-2 text-lg">🏆 Kirim JUARA 1 ➔</button>
        <button onclick="sendToLive('show-all')" class="bg-blue-600 hover:bg-blue-500 p-3 rounded font-bold col-span-2 mt-2">🌟 Tampilkan Semua ➔</button>
        <button onclick="sendToLive('clear')" class="bg-red-600 hover:bg-red-500 p-3 rounded font-bold col-span-2 mt-2">✖ Clear Live Screen</button>
      </div>
    </div>

    <!-- DUAL MONITOR (KANAN) -->
    <div class="w-2/3 flex flex-col gap-4">
      
      <!-- PREVIEW (STANDBY) -->
      <div class="bg-slate-800 p-3 rounded-xl shadow-xl flex-1 flex flex-col border border-slate-600">
        <h2 class="font-bold text-xs text-slate-400 mb-2">PREVIEW (STANDBY) - Berubah otomatis saat mengetik</h2>
        <div class="w-full h-full bg-slate-950 rounded border border-slate-700 relative overflow-hidden flex flex-col items-center justify-center p-4">
          <h3 class="text-2xl font-black text-yellow-500 mb-4">PREVIEW SEMUA</h3>
          <div class="flex w-full justify-around text-center">
            <div><p class="text-sm text-slate-400">Juara 3</p><p id="prev-j3" class="text-xl font-bold text-white">-</p></div>
            <div><p class="text-sm text-yellow-500">Juara 1</p><p id="prev-j1" class="text-2xl font-bold text-white">-</p></div>
            <div><p class="text-sm text-slate-400">Juara 2</p><p id="prev-j2" class="text-xl font-bold text-white">-</p></div>
          </div>
        </div>
      </div>

      <!-- LIVE OUTPUT -->
      <div class="bg-slate-800 p-3 rounded-xl shadow-xl flex-1 flex flex-col border-2 border-red-900">
        <h2 class="font-bold text-xs text-red-400 mb-2 animate-pulse">🔴 LIVE OUTPUT (Tayang di LED)</h2>
        <div class="w-full h-full bg-black rounded border border-slate-700 relative overflow-hidden flex flex-col items-center justify-center">
          <div id="live-display" class="text-center">
            <p class="text-slate-600 font-bold">Layar Kosong (Standby)</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    // SISTEM LISENSI
    window.onload = async () => {
      if(localStorage.getItem('isActivated') === 'true') {
        document.getElementById('lock-screen').style.display = 'none';
      } else {
        const hwid = await ipcRenderer.invoke('get-hwid');
        document.getElementById('hwid-display').value = hwid;
      }
    };

    async function activateApp() {
      const key = document.getElementById('license-input').value.trim();
      const isValid = await ipcRenderer.invoke('verify-license', key);
      if(isValid) {
        localStorage.setItem('isActivated', 'true');
        document.getElementById('lock-screen').style.display = 'none';
        alert("Aktivasi Berhasil!");
      } else {
        alert("License Key Salah!");
      }
    }

    // BUKA LAYAR LED
    function openLedWindow() {
      ipcRenderer.send('open-led');
    }

    // UPDATE PREVIEW REALTIME
    function updatePreview() {
      document.getElementById('prev-j3').innerText = document.getElementById('j3').value || '-';
      document.getElementById('prev-j2').innerText = document.getElementById('j2').value || '-';
      document.getElementById('prev-j1').innerText = document.getElementById('j1').value || '-';
    }

    // KIRIM KE LIVE & LED
    function sendToLive(action) {
      const j1 = document.getElementById('j1').value || '-';
      const j2 = document.getElementById('j2').value || '-';
      const j3 = document.getElementById('j3').value || '-';
      
      const liveDiv = document.getElementById('live-display');

      // Render di panel LIVE Operator
      if(action === 'clear') {
        liveDiv.innerHTML = '<p class="text-slate-600 font-bold">Layar Kosong (Standby)</p>';
      } else if (action === 'show-all') {
        liveDiv.innerHTML = `<h3 class="text-xl font-black text-yellow-500 mb-2">SEMUA JUARA</h3><div class="flex gap-4 text-center"><div><p class="text-xs">J3</p><p class="font-bold">${j3}</p></div><div><p class="text-xs text-yellow-500">J1</p><p class="font-bold text-lg">${j1}</p></div><div><p class="text-xs">J2</p><p class="font-bold">${j2}</p></div></div>`;
      } else {
        let title = action === 'show-j1' ? 'JUARA 1' : (action === 'show-j2' ? 'JUARA 2' : 'JUARA 3');
        let name = action === 'show-j1' ? j1 : (action === 'show-j2' ? j2 : j3);
        liveDiv.innerHTML = `<h3 class="text-xl font-bold text-yellow-400">${title}</h3><p class="text-2xl font-black text-white">${name}</p>`;
      }

      // Kirim perintah ke Layar ke-2 (led.html)
      ipcRenderer.send('send-to-led', { action, j1, j2, j3 });
    }
  </script>
</body>
</html>
